<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #121212;
    --card-bg: #181818;
    --input-bg: #1e1e1e;
    --border: #333333;
    --border-input: #444444;
    --border-subtle: #2a2a2a;
    --text: #e0e0e0;
    --text-muted: #8d96a0;
    --accent: #58a6ff;
    --danger: #ff5252;
    --success: #4caf50;
    --btn-bg: #333333;
    --btn-hover: #444444;
    --user-bg: #1e1e1e;
    --ai-bg: #181818;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    background-color: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 2px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    z-index: 10;
  }

  .group { display: flex; align-items: center; gap: 12px; }

  nav span.title {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  button {
    padding: 6px 12px;
    cursor: pointer;
    background-color: var(--btn-bg);
    border: 1px solid var(--border-input);
    border-radius: 4px;
    font-weight: 500;
    font-size: 12px;
    color: #ffffff;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: system-ui, sans-serif;
  }

  button:hover {
    background-color: var(--btn-hover);
    border-color: #555;
  }

  .cheese { display: inline-block; font-size: 13px; }
  @keyframes cheesespin { to { transform: rotate(360deg); } }

  /* ---------- Thinking block ---------- */
  .think { color: var(--text-muted); font-size: 13px; min-width: 0; }
  .think.has-answer {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .chev { display: inline-flex; flex-shrink: 0; line-height: 0; }
  .chev svg { width: 14px; height: 14px; display: block; transition: transform 0.15s; }

  .think-head {
    padding: 2px 0;
    background: none;
    border: none;
    border-radius: 0;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    gap: 6px;
    text-align: left;
  }
  .think-head:hover { background: none; border: none; color: #ffffff; }
  .think-head .cheese { font-size: 14px; animation: cheesespin 0.55s linear infinite; }
  .think:not(.thinking) .think-head .cheese { display: none; }
  .think.thinking .think-head { color: #fbbf24; }
  .think:not(.has-rows) .think-head { cursor: default; }
  .think:not(.has-rows) .think-head .chev { display: none; }
  .think.collapsed .think-head .chev svg { transform: rotate(-90deg); }

  .think-panel {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .think:not(.has-rows) .think-panel,
  .think.collapsed .think-panel { display: none; }

  .think-row + .think-row { border-top: 1px solid var(--border-subtle); }

  .think-row-head {
    width: 100%;
    padding: 10px 12px;
    background: none;
    border: none;
    border-radius: 0;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    gap: 10px;
    text-align: left;
  }
  .think-row-head:hover { background: #1c1c1c; border: none; }
  .think-row-head .ico { display: inline-flex; flex-shrink: 0; line-height: 0; }
  .think-row-head .ico svg { width: 14px; height: 14px; display: block; }
  .think-row-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .think-row-title .hl { color: #ffffff; font-weight: 500; margin-left: 4px; }
  .think-row:not(.open) .chev svg { transform: rotate(-90deg); }
  .think-row.no-body .chev { visibility: hidden; }
  .think-row.no-body .think-row-head { cursor: default; }
  .think-row.active .ico { color: #fbbf24; }
  .think-row.active .think-row-title { color: var(--text); }

  .think-row-body {
    display: none;
    padding: 0 12px 12px 36px;
    font-size: 12.5px;
    line-height: 1.55;
    color: #7d8590;
  }
  .think-row.open .think-row-body { display: block; }
  .think-row-body p { margin-bottom: 0.5em; }
  .think-row-body p:last-child { margin-bottom: 0; }
  .think-row-body a {
    display: block;
    padding: 2px 0;
    color: var(--accent);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .think-row-body a:hover { text-decoration: underline; }
  .think-q { padding: 2px 0; }

  /* ---------- Layout + sidebar ---------- */
  .app { flex: 1; display: flex; min-height: 0; overflow: hidden; position: relative; }

  #sidebar {
    width: 264px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
  }
  .app.sidebar-hidden #sidebar { display: none; }
  #sidebar-backdrop { display: none; }

  .sidebar-top { padding: 12px; flex-shrink: 0; }
  #new-chat-btn { width: 100%; justify-content: center; padding: 9px 12px; font-size: 13px; }
  #new-chat-btn svg { width: 14px; height: 14px; display: block; }

  #chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .chat-group {
    padding: 14px 10px 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.2px;
  }
  .chat-list-empty { padding: 20px 12px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

  .chat-item { display: flex; align-items: center; border-radius: 6px; }
  .chat-item:hover { background: var(--input-bg); }
  .chat-item.active { background: var(--input-bg); box-shadow: inset 2px 0 0 var(--accent); }
  .chat-open {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    background: none;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    justify-content: flex-start;
  }
  .chat-open:hover { background: none; border: none; }
  .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-del {
    display: none;
    flex-shrink: 0;
    margin-right: 4px;
    padding: 6px;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--text-muted);
    line-height: 0;
  }
  .chat-del svg { width: 15px; height: 15px; display: block; }
  .chat-del:hover { background: none; border: none; color: var(--danger); }
  .chat-item:hover .chat-del,
  .chat-item.active .chat-del,
  .chat-item.confirm .chat-del { display: inline-flex; }
  .chat-item.confirm .chat-del { color: var(--danger); font-size: 12px; line-height: 1.2; padding: 5px 8px; }
  @media (hover: none) { .chat-del { display: inline-flex; } }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 850px;
    min-width: 0;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadein 0.18s ease;
  }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-row.error { align-self: flex-start; align-items: flex-start; }
  .msg-row.debug-notice { align-self: flex-start; align-items: flex-start; }
  @keyframes fadein { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

  .msg-label {
    font-family: monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .msg-row.user .msg-label { color: var(--accent); }
  .msg-row.assistant .msg-label { color: var(--text-muted); }
  .msg-row.error .msg-label { color: var(--danger); }
  .msg-row.debug-notice .msg-label { color: #fbbf24; }

  .msg {
    border-radius: 4px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    min-width: 0;
    max-width: 100%;
  }
  .msg-row.user .msg {
    background: var(--user-bg);
    border-color: var(--border-input);
  }
  .msg-row.assistant .msg {
    background: var(--ai-bg);
    border-color: var(--border);
    transition: border-color 1.2s ease;
  }

  .msg-row.assistant.generating .msg { border-color: #d97706; }
  .msg-row.error .msg {
    background: #1a0000;
    border-color: #5a2020;
  }
  .msg-row.debug-notice .msg {
    background: #1c1300;
    border-color: #5a4000;
    border-left: 3px solid #fbbf24;
  }

  .msg-body { color: var(--text); line-height: 1.6; font-size: 14px; }
  .msg-body:empty { display: none; }
  .msg-row.user .msg-body { white-space: pre-wrap; color: #ffffff; }
  .msg-row.error .msg-body { color: var(--danger); font-family: monospace; }
  .msg-row.debug-notice .msg-body { color: #d97706; font-size: 13px; font-family: monospace; }

  .streaming-cursor::after {
    content: '🧀 ';
    display: inline-block;
    animation: cur 0.7s steps(1) infinite;
    color: var(--accent);
    margin-left: 2px;
  }
  @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

  .msg-body p { margin-bottom: 0.75em; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body strong { color: #ffffff; font-weight: 600; }
  .msg-body em { font-style: italic; color: #c9d1d9; }
  .msg-body h1, .msg-body h2, .msg-body h3 {
    color: #ffffff;
    font-weight: 600;
    margin: 1em 0 0.4em;
    letter-spacing: -0.3px;
  }
  .msg-body h1 { font-size: 1.2em; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px; }
  .msg-body h2 { font-size: 1.1em; }
  .msg-body h3 { font-size: 1.0em; }
  .msg-body ul, .msg-body ol { padding-left: 1.5em; margin-bottom: 0.75em; }
  .msg-body li { margin-bottom: 0.25em; }
  .msg-body li::marker { color: var(--accent); }
  .msg-body a { color: var(--accent); text-decoration: none; }
  .msg-body a:hover { text-decoration: underline; }
  .msg-body blockquote {
    border-left: 3px solid #444;
    padding-left: 12px;
    color: var(--text-muted);
    margin: 0.75em 0;
  }
  .msg-body hr { border: none; border-top: 1px solid var(--border-subtle); margin: 1em 0; }
  
  .msg-body code {
    background: var(--input-bg);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12.5px;
    color: #e0e0e0;
  }

  .msg-body pre {
    margin: 0.85em 0;
    border-radius: 4px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
  }
  .msg-body pre .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #121212;
    padding: 6px 12px;
    font-size: 11px;
    font-family: monospace;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    user-select: none;
    text-transform: uppercase;
  }
  .msg-body pre .copy-btn {
    background: transparent;
    border: 1px solid var(--border-input);
    color: var(--text-muted);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
  }
  .msg-body pre .copy-btn:hover { background: var(--btn-hover); color: #fff; }

  .msg-body pre code {
    background: transparent !important;
    border: none;
    padding: 12px 14px;
    display: block;
    font-size: 13px;
    color: inherit;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-x: hidden;
    width: 100%;
  }

  .msg-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.85em 0;
    font-size: 13px;
    font-family: monospace;
  }
  .msg-body th, .msg-body td {
    border: 1px solid var(--border-subtle);
    padding: 8px 12px;
    text-align: left;
  }
  .msg-body th {
    background: #121212;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
  }
  .msg-body tr:nth-child(even) td { background: #141414; }

  .msg-body .katex { font-size: 1.08em; color: inherit; }
  .msg-body .katex-display {
    margin: 0.85em 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 0;
  }
  .msg-body .katex-display > .katex { white-space: nowrap; }

  .msg-actions { display: flex; gap: 2px; margin-top: 6px; padding: 0 2px; }
  .icon-btn {
    padding: 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-muted);
    line-height: 0;
    transition: color 0.15s, background-color 0.15s;
  }
  .icon-btn:hover { background: var(--btn-bg); border-color: transparent; color: #ffffff; }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .msg-body, .msg-body * { -webkit-user-select: text; user-select: text; }
  .msg-body .code-header, .msg-body .code-header * { -webkit-user-select: none; user-select: none; }

  #empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    font-family: monospace;
    pointer-events: none;
    user-select: none;
    animation: fadein 0.5s ease;
  }

  #attachment-tray { display: none; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
  #attachment-tray.has-files { display: flex; }
  .attach-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--border-input);
    border-radius: 4px;
    padding: 6px 10px;
    max-width: 200px;
    min-width: 120px;
  }
  .attach-card.is-image {
    padding: 0;
    overflow: hidden;
    width: 64px;
    height: 64px;
    min-width: unset;
    max-width: unset;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .attach-card.is-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-card .file-icon { font-size: 18px; flex-shrink: 0; }
  .attach-card .file-info { display: flex; flex-direction: column; overflow: hidden; }
  .attach-card .file-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
  .attach-card .file-type { font-size: 9px; color: var(--text-muted); background: #121212; border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; margin-top: 2px; font-family: monospace; text-transform: uppercase; }
  .attach-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #333;
    border: 1px solid var(--border-input);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 0;
  }
  .attach-remove:hover { background: var(--danger); border-color: var(--danger); }

  .msg-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .msg-attach-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .msg-attach-card.is-image { width: 80px; height: 80px; }
  .msg-attach-card.is-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-attach-card.is-file { display: flex; align-items: center; gap: 8px; padding: 6px 10px; max-width: 220px; }
  .msg-attach-card .f-icon { font-size: 18px; flex-shrink: 0; }
  .msg-attach-card .f-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
  .msg-attach-card .f-ext { font-size: 9px; color: var(--text-muted); background: #121212; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; text-transform: uppercase; font-family: monospace; }

  #input-area {
    flex-shrink: 0;
    border-top: 2px solid var(--border);
    background: var(--bg);
    padding: 16px 24px;
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border-input);
    border-radius: 4px;
    padding: 10px 12px;
  }
  #input-row:focus-within { border-color: #666; }
  #prompt-symbol {
    color: var(--text-muted);
    font-family: monospace;
    font-size: 14px;
    height: 32px;
    display: flex;
    align-items: center;
    user-select: none;
    flex-shrink: 0;
  }

  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: monospace;
    font-size: 13px;
    color: #ffffff;
    resize: none;
    line-height: 20px;
    padding: 6px 0;
    min-height: 32px;
    max-height: 160px;
    overflow-y: auto;
  }
  #chat-input::placeholder { color: #555; }

  .input-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    justify-content: center;
    background: var(--btn-bg);
    border: 1px solid var(--border-input);
    border-radius: 4px;
    color: #ffffff;
    cursor: pointer;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .input-btn:hover { background: var(--btn-hover); border-color: #555; }
  .input-btn svg { width: 16px; height: 16px; display: block; }
  #send-btn.stopping { border-color: #b91c1c; color: var(--danger); }

  #hint { font-size: 11px; color: #555; margin-top: 8px; font-family: monospace; text-align: center; }

  #paste-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text);
    font-family: monospace;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 999;
  }
  #paste-toast.show { opacity: 1; }

  @media (max-width: 760px) {
    #sidebar { position: absolute; z-index: 20; top: 0; bottom: 0; left: 0; box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
    .app:not(.sidebar-hidden) #sidebar-backdrop { display: block; position: absolute; inset: 0; z-index: 15; background: rgba(0,0,0,0.5); }
    nav { padding: 12px 16px; }
    #log { padding: 16px; }
    .msg-row { max-width: 94%; }
    #input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<nav>
  <div class="group">
    <button id="sidebar-toggle" class="icon-btn" type="button" title="Toggle chat list" aria-label="Toggle chat list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <span class="title">cheddargpt</span>
    <span id="debug-badge" style="display:none; font-size:11px; font-family:monospace; padding:2px 8px; border-radius:4px; border:1px solid #5a4000; color:#fbbf24; background:#1c1300;">debug mode</span>
  </div>
</nav>

<input type="checkbox" id="debug-toggle" style="display:none">

<div class="app" id="app">
<div id="sidebar-backdrop"></div>
<aside id="sidebar" aria-label="Chats">
  <div class="sidebar-top">
    <button id="new-chat-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  </div>
  <div id="chat-list"></div>
</aside>

<div class="chat-container">
  <div id="log">
    <div id="empty"></div>
  </div>

  <div id="input-area">

let autoDetect = true;
const hlCache = new Map();
const mathCache = new Map();

function highlightCode(raw, lang) {
  const known = lang && hljs.getLanguage(lang);
  if (!known && !autoDetect) return escapeHtml(raw);
  const key = (known ? lang : '?') + '\u0000' + raw;
  let out = hlCache.get(key);
  if (out === undefined) {
    out = known
      ? hljs.highlight(raw, { language: lang }).value
      : hljs.highlightAuto(raw).value;
    if (hlCache.size > 200) hlCache.clear();
    hlCache.set(key, out);
  }
  return out;
}

marked.use({
  breaks: true, gfm: true,
  renderer: {
    code(token) {
      const lang = token.lang || '';
      const raw = token.text || '';
      const hl = highlightCode(raw, lang);
      return `<pre><div class="code-header"><span>${lang || 'plaintext'}</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div><code class="hljs">${hl}</code></pre>`;
    }
  }
});


const CODE_SPLIT_RE = /(```[\s\S]*?(?:```|$)|`[^`\n]*`)/g;

function renderMarkdown(src, final = true) {
  autoDetect = final;
  const stash = [];

  const math = (expr, display, original) => {
    const key = (display ? 'D:' : 'I:') + expr;
    let html = mathCache.get(key);
    if (html === undefined) {
      try {
        html = katex.renderToString(expr.trim(), { displayMode: display, throwOnError: false });
      } catch (e) {
        return original;
      }
      if (mathCache.size > 300) mathCache.clear();
      mathCache.set(key, html);
    }
    stash.push(html);
    return `zzmath${stash.length - 1}zz`;
  };

  const parts = src.split(CODE_SPLIT_RE);
  const prepared = parts.map((seg, i) => {
    if (i % 2 === 1) return seg;
    return seg
      .replace(/\$\$([\s\S]+?)\$\$/g,  (m, e) => math(e, true, m))
      .replace(/\\\[([\s\S]+?)\\\]/g,  (m, e) => math(e, true, m))
      .replace(/\\\(([\s\S]+?)\\\)/g,  (m, e) => math(e, false, m))
      .replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$(?!\d)/g,
               (m, pre, e) => pre + math(e, false, m.slice(pre.length)));
  }).join('');

  const html = marked.parse(prepared);
  return html.replace(/zzmath(\d+)zz/g, (m, i) => stash[+i] ?? m);
}

function parseThoughts(raw) {
  const re = /(?<![^\n])[ \t]*\*\*([^*\n]+)\*\*[ \t]*(?:\r?\n|$)/g;
  const steps = [];
  let m, prev = null;
  while ((m = re.exec(raw)) !== null) {
    if (prev) prev.body = raw.slice(prev.from, m.index).trim();
    prev = { title: m[1].trim(), body: '', from: re.lastIndex };
    steps.push(prev);
  }
  if (prev) prev.body = raw.slice(prev.from).trim();
  if (!steps.length) {
    const t = raw.trim();
    if (!t) return [];
    if (t.startsWith('**')) return [];   // title is still streaming in
    return [{ title: 'Thinking', body: t }];
  }
  return steps;
}

        let n = nodes[i];
        if (n && n.kind !== d.kind) {
          const fresh = makeNode(d.kind);
          n.root.replaceWith(fresh.root);
          nodes[i] = n = fresh;
        }
        if (!n) { n = nodes[i] = makeNode(d.kind); panel.appendChild(n.root); }
        if (n.titleHtml !== d.title) { n.title.innerHTML = d.title; n.titleHtml = d.title; }
        if (n.sig !== d.sig) { n.sig = d.sig; d.render(n.body); }
        n.root.classList.toggle('no-body', !d.sig);
      });
      while (nodes.length > desc.length) nodes.pop().root.remove();

      let lastThought = -1;
      desc.forEach((d, i) => { if (d.kind === 'thought') lastThought = i; });
      nodes.forEach((n, i) => n.root.classList.toggle('active', doneMs === null && i === lastThought));
      renderHead();
    },
    setStatus(s) { status = s; renderHead(); },
    finish(hasAnswer, ms) {
      if (hasAnswer) el.classList.add('has-answer');
      if (doneMs !== null) return;
      doneMs = (typeof ms === 'number') ? ms : performance.now() - t0;
      clearInterval(timer);
      el.classList.remove('thinking');
      nodes.forEach(n => n.root.classList.remove('active'));
      renderHead();
    },
    reset() {
      nodes.forEach(n => n.root.remove());
      nodes = [];
      status = null;
      renderHead();
    },
    elapsed() { return doneMs !== null ? doneMs : performance.now() - t0; },
    remove() { clearInterval(timer); el.remove(); },
    dispose() { clearInterval(timer); },
  };
}

function createStreamMsg() {
  removeEmpty();
  const row = document.createElement('div'); row.className = 'msg-row assistant generating';
  const lbl = document.createElement('div'); lbl.className = 'msg-label'; lbl.textContent = 'cheddarGPT';
  const bubble = document.createElement('div'); bubble.className = 'msg';
  const thinkEl = document.createElement('div'); thinkEl.className = 'think thinking';
  const body = document.createElement('div'); body.className = 'msg-body';
  bubble.append(thinkEl, body);
  row.appendChild(lbl); row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return { row, body, think: createThinkView(thinkEl) };
}

function makeIconBtn(icon, label, extraClass = '') {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = ('icon-btn ' + extraClass).trim();
  b.title = label;
  b.setAttribute('aria-label', label);
  b.innerHTML = ICONS[icon];
  return b;
}

function addActions(rowEl, { text, regen = false }) {
  const bar = document.createElement('div');
  bar.className = 'msg-actions';

  if (text) {
    const copyBtn = makeIconBtn('copy', 'Copy');
    copyBtn.onclick = async () => {
      const ok = await copyToClipboard(text);
      copyBtn.innerHTML = ok ? ICONS.check : ICONS.copy;
      copyBtn.style.color = ok ? '#4caf50' : 'var(--danger)';
      copyBtn.title = ok ? 'Copied!' : 'Copy failed';
      setTimeout(() => {
        copyBtn.innerHTML = ICONS.copy;
        copyBtn.style.color = '';
        copyBtn.title = 'Copy';
      }, 1500);
    };
    bar.appendChild(copyBtn);
  }

  if (regen) {
    const regenBtn = makeIconBtn('refresh', 'Regenerate', 'regen-btn');
    regenBtn.onclick = regenerate;
    bar.appendChild(regenBtn);
  }

  if (bar.children.length) rowEl.appendChild(bar);
}

function stripRegen() { log.querySelectorAll('.regen-btn').forEach(b => b.remove()); }

function finishAssistantRow(rowEl, text) {
  rowEl.classList.remove('generating');
  stripRegen();
  addActions(rowEl, { text, regen: true });
  log.scrollTop = log.scrollHeight;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function abortError() { return new DOMException('Aborted', 'AbortError'); }

let lastUser = null;
let abortCtl = null;
let stopFlag = false;
let toastTimer = null;

function showToast(text) {
  pasteToast.textContent = text;
  pasteToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => pasteToast.classList.remove('show'), 2200);
}

function setBusy(state) {
  busy = state;
  sendBtn.innerHTML = state ? ICONS.stop : ICONS.send;
  sendBtn.classList.toggle('stopping', state);
  const label = state ? 'Stop responding' : 'Send';
  sendBtn.title = label;
  sendBtn.setAttribute('aria-label', label);
}

function stopGeneration() {
  if (!busy) return;
  stopFlag = true;
  if (abortCtl) abortCtl.abort();
}

/* ---------- Saved chats (browser localStorage, one set per CheddarOS user) ---------- */

const STORE_PREFIX = 'cheddargpt-chats-v1:';
const MAX_CHATS = 100;
const MAX_PERSIST_TEXT = 20000;   // long attached-file text is trimmed when saved

let chats = [];      // newest first
let current = null;  // the open chat (null = blank new chat)

function storeKey() { return STORE_PREFIX + getCheddarUsername(); }

function loadChats() {
  try {
    const data = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (data && Array.isArray(data.chats)) {
      chats = data.chats.filter(c => c && c.id && Array.isArray(c.msgs));
      chats.sort((a, b) => b.updated - a.updated);
    }
  } catch (e) { chats = []; }
}

function persist() {
  const ser = () => JSON.stringify({ v: 1, chats }, (k, v) => k === 'live' ? undefined : v);
  for (let i = 0; i < 50; i++) {
    try { localStorage.setItem(storeKey(), ser()); return true; }
    catch (e) {
      let idx = -1, oldest = Infinity;
      chats.forEach((c, j) => { if (c !== current && c.updated < oldest) { oldest = c.updated; idx = j; } });
      if (idx === -1) { showToast('⚠️ Storage is full — this chat could not be saved'); return false; }
      chats.splice(idx, 1);
      showToast('Storage full — removed the oldest chat');
    }
  }
  return false;
}

function newChatObj() {
  return { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: 'New chat', created: Date.now(), updated: Date.now(), msgs: [] };
}

function titleFrom(text, files) {
  const t = (text || '').replace(/\s+/g, ' ').trim() || (files && files[0] && files[0].name) || 'New chat';
  return t.length > 44 ? t.slice(0, 44).trimEnd() + '…' : t;
}

function touch(chat) {
  chat.updated = Date.now();
  chats.sort((a, b) => b.updated - a.updated);
  if (chats.length > MAX_CHATS) chats.length = MAX_CHATS;
}

// Images are too big for localStorage, so only a placeholder is saved for them.
function persistableParts(parts) {
  return parts.map(p => {
    if (p.inlineData) return { text: '[image attached earlier]' };
    if (p.text && p.text.length > MAX_PERSIST_TEXT) return { text: p.text.slice(0, MAX_PERSIST_TEXT) + '\n[truncated]' };
    return p;
  });
}

// If the last message is a user message with no reply (reply failed or tab closed), drop it, like a failed send.
function popUser() {
  if (!current) return;
  const last = current.msgs[current.msgs.length - 1];
  if (last && last.role === 'user') current.msgs.pop();
  if (!current.msgs.length) {
    chats = chats.filter(c => c !== current);
    current = null;
  }
  persist();
  renderSidebar();
}

function bucketOf(ts) {
  const d = new Date();
  const startToday = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const day = 86400000;
  if (ts >= startToday) return 'Today';
  if (ts >= startToday - day) return 'Yesterday';
  if (ts >= startToday - 6 * day) return 'Previous 7 days';
  return 'Older';
}

const appEl = document.getElementById('app');
const chatList = document.getElementById('chat-list');
const isMobile = () => !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches);

function renderSidebar() {
  chatList.innerHTML = '';
  if (!chats.length) {
    chatList.innerHTML = '<div class="chat-list-empty">No saved chats yet. Your conversations are saved in this browser.</div>';
    return;
  }
  let lastBucket = null;
  chats.forEach(c => {
    const b = bucketOf(c.updated);
    if (b !== lastBucket) {
      lastBucket = b;
      const h = document.createElement('div'); h.className = 'chat-group'; h.textContent = b;
      chatList.appendChild(h);
    }
    const item = document.createElement('div');
    item.className = 'chat-item' + (current && current.id === c.id ? ' active' : '');

    const open = document.createElement('button');
    open.type = 'button'; open.className = 'chat-open'; open.title = c.title;
    const t = document.createElement('span'); t.className = 'chat-title'; t.textContent = c.title;
    open.appendChild(t);
    open.onclick = () => openChat(c.id);

    const del = document.createElement('button');
    del.type = 'button'; del.className = 'chat-del'; del.title = 'Delete chat'; del.setAttribute('aria-label', 'Delete chat');
    del.innerHTML = ICONS.trash;
    del.onclick = (e) => {
      e.stopPropagation();
      if (item.classList.contains('confirm')) { deleteChat(c.id); return; }
      item.classList.add('confirm');
      del.textContent = 'Delete?';
      setTimeout(() => { item.classList.remove('confirm'); del.innerHTML = ICONS.trash; }, 3000);
    };

    item.append(open, del);
    chatList.appendChild(item);
  });
}

function appendRestoredModel(m, isLast) {
  const { row, body, think } = createStreamMsg();
  row.classList.remove('generating');
  row.dataset.hasModel = '1';
  if (m.think) {
    think.setRows(m.think.steps || [], m.think.search || null);
    think.finish(true, typeof m.think.ms === 'number' ? m.think.ms : 1000);
  } else {
    think.remove();
  }
  body.innerHTML = renderMarkdown(m.text || '');
  addActions(row, { text: m.text, regen: isLast });
}

function renderChat(chat) {
  log.innerHTML = '';
  if (!chat || !chat.msgs.length) {
    log.innerHTML = '<div id="empty"></div>';
    initSplash();
    return;
  }
  const n = chat.msgs.length;
  chat.msgs.forEach((m, i) => {
    if (m.role === 'user') {
      const body = appendMsg('user', m.text, false, m.files || []);
      if (m.text) addActions(body.closest('.msg-row'), { text: m.text });
    } else {
      appendRestoredModel(m, i === n - 1);
    }
  });
  log.scrollTop = log.scrollHeight;
}

function openChat(id) {
  if (busy) { showToast('Wait for the reply to finish, or stop it first'); return; }
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  if (isMobile()) appEl.classList.add('sidebar-hidden');
  if (current === chat) return;
  current = chat;
  lastUser = [...chat.msgs].reverse().find(m => m.role === 'user') || null;
  renderChat(chat);
  renderSidebar();
  chatInput.focus();
}

function startNewChat() {
  if (busy) { showToast('Wait for the reply to finish, or stop it first'); return; }
  if (isMobile()) appEl.classList.add('sidebar-hidden');
  current = null;
  lastUser = null;
  renderChat(null);
  renderSidebar();
  chatInput.focus();
}

function deleteChat(id) {
  if (busy && current && current.id === id) { showToast('Stop the reply before deleting this chat'); return; }
  chats = chats.filter(c => c.id !== id);
  if (current && current.id === id) {
    current = null;
    lastUser = null;
    renderChat(null);
  }
  persist();
  renderSidebar();
}

document.getElementById('new-chat-btn').onclick = startNewChat;
document.getElementById('sidebar-toggle').onclick = () => appEl.classList.toggle('sidebar-hidden');
document.getElementById('sidebar-backdrop').onclick = () => appEl.classList.add('sidebar-hidden');
if (isMobile()) appEl.classList.add('sidebar-hidden');

/* ---------- Replies ---------- */

function settle(rowEl, bodyEl, answer, stopped, debug, think, state) {
  think.finish(!!answer);
  bodyEl.classList.remove('streaming-cursor');
  rowEl.classList.remove('generating');
  if (!answer) {
    const note = stopped ? '(stopped)' : '(no response)';
    bodyEl.innerHTML = `<span style="color:var(--text-muted); font-family:monospace;">${note}</span>`;
    if (!debug) popUser();
    stripRegen();
    addActions(rowEl, { regen: true });
    return;
  }
  if (!debug && current) {
    current.msgs.push({
      role: 'model',
      text: answer,
      think: {
        steps: (state.steps || []).map(s => ({ title: s.title, body: s.body })),
        search: state.search,
        ms: Math.round(think.elapsed())
      }
    });
    touch(current);
    persist();
    renderSidebar();
  }
  finishAssistantRow(rowEl, answer);
  if (!debug) {
    rowEl.dataset.hasModel = '1';
    logToDiscord(lastUser?.text, answer);
  }
}

function regenerate() {
  if (busy || !lastUser) return;

  const rows = log.querySelectorAll('.msg-row.assistant');
  const lastRow = rows[rows.length - 1];
  const hadModelTurn = lastRow?.dataset.hasModel === '1';
  lastRow?.remove();
  stripRegen();

  if (!debugToggle.checked) {
    if (!current) {
      current = newChatObj();
      current.title = titleFrom(lastUser.text, lastUser.files);
      chats.unshift(current);
    }
    const msgs = current.msgs;
    if (hadModelTurn && msgs.length && msgs[msgs.length - 1].role === 'model') msgs.pop();
    if (!msgs.length || msgs[msgs.length - 1].role !== 'user') msgs.push(lastUser);
    touch(current);
    persist();
    renderSidebar();
  }
  generate();
}

/* ---------- Request building ---------- */

// Keeps requests small: only the last MAX_HISTORY messages, and images only from the most recent few.
// Consecutive messages from the same role are merged so the API always sees alternating turns.
function buildContents() {
  const msgs = current.msgs.slice(-MAX_HISTORY);
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  const keepFrom = msgs.length - KEEP_IMAGES_FOR;
  const out = [];
  msgs.forEach((m, i) => {
    const parts = m.role === 'model'
      ? [{ text: m.text }]
      : (i >= keepFrom ? (m.live || m.parts) : m.parts);
    const prev = out[out.length - 1];
    if (prev && prev.role === m.role) prev.parts = prev.parts.concat(parts);
    else out.push({ role: m.role, parts: [...parts] });
  });
  return out;
}

/* ---------- Streaming with automatic retry ---------- */

async function tryOnce(attempt, state, think, onThought, onAnswer, onSearch) {
  const useTools = WEB_SEARCH && !searchBroken;
  const useFallback = !!FALLBACK_MODEL && attempt >= FALLBACK_AFTER;
  const generationConfig = { maxOutputTokens: 8192 };
  if (!useFallback) {
    generationConfig.thinkingConfig = { thinkingLevel: THINKING_LEVEL, includeThoughts: true };
  }

  const ctl = new AbortController();
  abortCtl = ctl;
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, HEADER_TIMEOUT_MS);

  let res;
  try {
    res = await fetch(STREAM_URL, {
      signal: ctl.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: useFallback ? FALLBACK_MODEL : PRIMARY_MODEL,
        stream: true,
        systemInstruction: { parts: [{ text: systemPrompt() }] },
        generationConfig,
        ...(useTools ? { tools: [{ google_search: {} }] } : {}),
        contents: buildContents()
      })
    });
  } catch (e) {
    clearTimeout(timer);
    if (stopFlag) throw e;
    return { retryable: true, message: timedOut ? 'Request timed out' : 'Network error: ' + e.message };
  }
  clearTimeout(timer);

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    let reason = errText, upstream = 0;
    try {
      const j = JSON.parse(errText);
      const e = j.error;
      reason = (typeof e === 'string' ? e : e?.message) || j.lastError || errText;
      if (j.lastStatus) { upstream = Number(j.lastStatus); reason += ` (upstream status: ${j.lastStatus})`; }
    } catch (e) {}
    if (res.status === 400 && useTools) {   // search tool not accepted: drop it and try again without
      searchBroken = true;
      return { retryable: true, message: `API Error 400: ${reason || '(no details returned)'}` };
    }
    return {
      retryable: RETRY_STATUSES.has(res.status) || RETRY_STATUSES.has(upstream),
      message: `API Error ${res.status}: ${reason || '(no details returned)'}`
    };
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let streamError = null;
  let blocked = null;
  let gotFirst = false;
  let thoughtParts = 0;

  const handleLine = (line) => {
    if (!line.startsWith('data:')) return;
    const data = line.slice(5).trim();
    if (!data || data === '[DONE]') return;

    let parsed;
    try { parsed = JSON.parse(data); } catch (e) { return; }

    if (parsed.error) {
      streamError = (typeof parsed.error === 'string' ? parsed.error : parsed.error.message) || 'Stream error';
      return;
    }
    if (parsed.promptFeedback?.blockReason) blocked = parsed.promptFeedback.blockReason;

    const cand = parsed.candidates?.[0];
    if (cand?.finishReason && /SAFETY|PROHIBITED|BLOCKLIST|SPII/i.test(cand.finishReason)) blocked = cand.finishReason;

    const gm = cand?.groundingMetadata;
    if (gm) {
      let changed = false;
      for (const q of gm.webSearchQueries || []) {
        if (!state.search.queries.includes(q)) { state.search.queries.push(q); changed = true; }
      }
      for (const c of gm.groundingChunks || []) {
        const w = c.web;
        if (w?.uri && !state.search.sources.some(x => x.uri === w.uri)) {
          state.search.sources.push({ uri: w.uri, title: w.title || w.uri });
          changed = true;
        }
      }
      if (changed) onSearch();
    }

    for (const p of cand?.content?.parts || []) {
      if (!p.text) continue;
      if (!gotFirst) { gotFirst = true; think.setStatus(null); }
      if (p.thought) { thoughtParts++; thoughtsSeen = true; onThought(p.text); }
      else onAnswer(p.text);
    }
  };

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      lines.forEach(handleLine);
    }
    if (buffer.trim()) handleLine(buffer);
  } catch (e) {
    if (stopFlag) throw e;
    streamError = 'Connection lost: ' + e.message;
  }

  console.info('[CheddarGPT] stream finished', { thoughtParts, answerChars: splitPlan(state.raw).answer.length, sources: state.search.sources.length, plan: !!splitPlan(state.raw).plan });
  if (splitPlan(state.raw).answer) return { ok: true };   // keep whatever we got, even if the stream ended early
  if (blocked) return { retryable: false, message: `The response was blocked (${blocked}).` };
  return { retryable: true, message: streamError || 'The model returned an empty response' };
}

async function runWithRetries(state, think, resetThoughts, onThought, onAnswer, onSearch) {
  let last = null, tried = 0;
  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    if (attempt > 0) {
      resetThoughts();
      think.setStatus(`Retrying (${attempt}/${MAX_ATTEMPTS - 1})…`);
      await sleep(RETRY_DELAYS[attempt - 1] ?? 2500);
    }
    if (stopFlag) throw abortError();
    tried++;
    last = await tryOnce(attempt, state, think, onThought, onAnswer, onSearch);
    if (last.ok) return last;
    if (!last.retryable) break;
  }
  return { error: last.message + (tried > 1 ? ` (tried ${tried} times)` : '') };
}

async function runDebug(onThought, onAnswer) {
  await sleep(500);
  for (const tok of DEBUG_THOUGHTS.match(/\S+\s*/g)) {
    if (stopFlag) throw abortError();
    onThought(tok);
    await sleep(22);
  }
  await sleep(300);
  for (const tok of DEBUG_RESPONSE.match(/\S+\s*/g)) {
    if (stopFlag) throw abortError();
    onAnswer(tok);
    await sleep(28);
  }
}

async function generate() {
  setBusy(true);
  stopFlag = false;

  const { row: rowEl, body: bodyEl, think } = createStreamMsg();
  const debug = debugToggle.checked;
  const state = { raw: '', thoughts: '', steps: [], search: { queries: [], sources: [] } };
  const answerOf = () => splitPlan(state.raw).answer;
  let answerStarted = false;
  let raf = 0;

  // Rendering is throttled to one paint per frame so long replies don't lag.
  const paint = (final) => {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const sp = splitPlan(state.raw);
    let steps = parseThoughts(state.thoughts);
    if (!steps.length && sp.plan) steps = planToSteps(sp.plan);
    state.steps = steps;
    if (steps.length || state.search.queries.length || state.search.sources.length) {
      think.setRows(steps, state.search);
    }
    if (sp.answer) {
      bodyEl.innerHTML = renderMarkdown(sp.answer, final);
      bodyEl.classList.toggle('streaming-cursor', !final);
    }
    log.scrollTop = log.scrollHeight;
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(false); }); };

  const onThought = (t) => { state.thoughts += t; schedule(); };
  const onAnswer = (t) => {
    state.raw += t;
    if (!answerStarted && answerOf()) { answerStarted = true; think.finish(true); }
    schedule();
  };
  const onSearch = () => schedule();
  const resetThoughts = () => {
    state.raw = ''; state.thoughts = ''; state.steps = [];
    state.search = { queries: [], sources: [] };
    think.reset();
  };

  try {
    if (debug) {
      await runDebug(onThought, onAnswer);
    } else {
      const r = await runWithRetries(state, think, resetThoughts, onThought, onAnswer, onSearch);
      if (r.error) {
        if (raf) cancelAnimationFrame(raf);
        think.dispose();
        rowEl.remove();
        appendMsg('error', r.error);
        popUser();
        return;
      }
    }
    paint(true);
    settle(rowEl, bodyEl, answerOf(), false, debug, think, state);

  } catch (err) {
    if (stopFlag) {
      paint(true);
      settle(rowEl, bodyEl, answerOf(), true, debug, think, state);
    } else {
      if (raf) cancelAnimationFrame(raf);
      think.dispose();
      rowEl.remove();
      appendMsg('error', 'Error: ' + err.message);
      if (!debug) popUser();
    }
  } finally {
    abortCtl = null;
    setBusy(false);
  }
}

async function send() {
  const text = chatInput.value.trim();
  const files = [...pendingFiles];
  if (!text && files.length === 0) return;

  chatInput.value = ''; chatInput.style.height = 'auto';
  pendingFiles = []; renderTray();

  stripRegen();
  const userBody = appendMsg('user', text, false, files);
  if (text) addActions(userBody.closest('.msg-row'), { text });

  const parts = [];
  for (const f of files) {
    if (f.isImage) {
      parts.push({ inlineData: { mimeType: f.mimeType, data: f.dataUrl.split(',')[1] } });
    } else {
      parts.push({ text: `[File: ${f.name}]\n${atob(f.dataUrl.split(',')[1])}` });
    }
  }
  if (text) parts.push({ text });

  const msg = {
    role: 'user',
    text,
    files: files.map(f => ({ name: f.name, ext: f.ext, isImage: f.isImage })),
    parts: persistableParts(parts),   // saved copy (no image data)
    live: parts                       // full copy, kept in memory only
  };
  lastUser = msg;

  if (!debugToggle.checked) {
    if (!current) { current = newChatObj(); chats.unshift(current); }
    if (!current.msgs.length) current.title = titleFrom(text, msg.files);
    current.msgs.push(msg);
    touch(current);
    persist();
    renderSidebar();
  }

  await generate();
}

loadChats();
renderSidebar();
initSplash();
</script>
